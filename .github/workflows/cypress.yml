name: Tests de Cypress

on:
  push:
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Instalar dependencias y correr los tests
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/01-compra.cy.js,cypress/e2e/03-contacto.cy.js